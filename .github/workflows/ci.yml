# ep9 CI on the 4 tier-1 targets (D2; docs/plan/09-milestones.md section 8 week 1;
# docs/plan/10-quality.md sections 2 and 5; docs/plan/08-repo.md section 7).
#
#   lint ............. fmt + clippy + rustdoc -D warnings; gc-lint   (Linux x64)
#                      jetstream/run.mjs, cross/run.mjs and t0-dispatch.mjs tests
#                      adr-lint since m0-exit (M1 exit item 6, plan v9 rule 26)
#   scope ............ docs_only for the pushed range                (Linux x64)
#                      (.github/scripts/ci-scope.sh, its self-test first)
#   build-test ....... build + test; clippy on the other 3 targets;  (4 targets)
#                      ep9_vm spike-native tests (Spike B native entry)
#   feature-matrix ... default, jitless, aot (H27; cargo xtask        (4 targets)
#                      feature-matrix), out of build-test for wall time
#   test262 .......... parse and exec runners vs expectations/;      (4 targets)
#                      exec with eager feedback; bytecodegen corpus
#                      digest (G1), debug too (not windows-x64); the
#                      nesting-cap tests (not windows-x64); on Linux
#                      x64 also the atom-key gate (G2, debug exec);
#                      the m0-exit inputs as an artifact
#   test262-gc ....... exec with GC-stress + eager feedback, 6 shards (4 targets)
#   fp-check ......... no libm call, no FMA outside ep9_math (H36);  (Linux x64)
#                      SoftFma vs hardware FMA
#   disasm ........... ep9_vm handler check (H15); ep9_heap barrier  (4 targets)
#   spikes ........... SP-Dispatch, SP-GC and SP-JIT-mem host gates  (4 targets)
#                      SP-Dispatch speed gates: recorded, not blocking (H15 ADR);
#                      cgoto.c built with zig cc 0.17.0 (H15-Q3);
#                      Spike B structural gate (checks (a)-(h));
#                      Spike B placement (b) gate (gate.sh b; aarch64 and x86-64);
#                      SP-Unit gate (gate.sh unit; 4 targets);
#                      Spike B Win64 unwind (windows-x64; tests/win64_unwind.rs);
#                      SP-Unit Win64 unwind (windows-x64; tests/win64_unit.rs);
#                      SP-Dispatch Zen 3 branchy report (linux-x64, windows-x64; report only, H15-Q2)
#   miri ............. Miri on ep9_value, ep9_heap and ep9_math      (Linux x64)
#   dep-guards ....... cargo tree / metadata guards; cargo deny      (Linux x64)
#   perf-ci-v0 ....... cachegrind instruction counts of 7 workloads  (Linux x64)
#                      as one JSON artifact and a step summary
#   sp-tsrs-win ...... tsrs_cli on Windows: recorded, not blocking   (Windows x64)
#   fuzz-smoke ....... cargo-fuzz, 60 s per front-end target; prints (Linux x64)
#                      only the crash count and hashes (V9-A17)
#
# 52 jobs: lint 1, scope 1, build-test 4, feature-matrix 4, test262 4, test262-gc 24, fp-check 1,
# disasm 4, spikes 4, miri 1, dep-guards 1, perf-ci-v0 1, sp-tsrs-win 1, fuzz-smoke 1.
#
# Scope (docs/plan/12-governance.md section 3; plan v9 V9-D35, V9-A18): every job except lint and
# scope `needs: scope` and is skipped when scope says docs_only=true. docs_only is true only when
# every changed path is under docs/ or is a root *.md, and none is docs/adr/README.md or under
# docs/measurements/ (code reads both); anything else fails closed to docs_only=false. A
# docs-only change runs scope and lint only (lint stays: its adr-lint step, from M4-P3, must see
# ADR commits). If scope fails, the other jobs still run (`!cancelled()`). GitHub counts a skipped job as green,
# so on a code change CI is done only when every one of the 52 jobs ran and none is pending or
# skipped. Timeouts follow the plan v9 section 9.2 budget table (rule 25: >= 1.5x the last
# measured time).
#
# Every action is pinned by full commit SHA; the comment names its release tag.
# The Rust toolchain comes from rust-toolchain.toml through .github/actions/setup-rust.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The nightly trigger (cron "17 19 * * *", REMOTE-CI decision, docs/plan/12-governance.md
  # section 3) and the per-event tiers stay off in month 4 (plan v9 V9-D35): every phase head
  # needs all 4 targets, and a nightly run would start every job even when main did not move.
  workflow_dispatch:
    inputs:
      # A dispatch has no pushed range. Empty: docs_only=false, every job runs. A commit: the range
      # from it to the dispatched commit, an ancestor or false (a CI probe of the docs-only path).
      scope_base:
        description: "scope: base commit of the range (empty: run every job)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# REMOTE-CI decision (docs/plan/12-governance.md section 3):
# pull_request: one group per PR; a new push cancels the PR's running CI.
# push: one group per commit, so every main commit gets its run (per-commit perf baseline).
# schedule, workflow_dispatch: one group per event and ref; never cancelled; a newer pending run
# replaces an older pending one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: fmt + clippy + rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # H10-Q2, H20 rule R2: no Local, Args, Rest, ArgsBuilder, ScratchList, PropertyDescriptor,
      # JsStr or FlatStr in a heap container, a static, a thread_local or a boxed closure
      # (tools/xtask/src/gc_lint.rs). Each finding names its file:line; every allow is listed.
      - run: cargo xtask gc-lint
      # Broken intra-doc links and other rustdoc warnings fail the job, private items too.
      - run: cargo doc --workspace --no-deps --locked --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # run.mjs gate logic with a fake engine; no JetStream checkout needed.
      - run: node --test tools/bench/jetstream/run.test.mjs
      # The cross-engine runner (PERF-NOISE order, intervals, load guard, refusal) with fake
      # engines; no shells, no checkout and no ep9 build needed.
      - run: node --test tools/bench/cross/run.test.mjs
      # t0-dispatch.mjs statistics (PERF-NOISE ranks, verdicts, arguments); no ep9 build needed.
      - run: node --test tools/bench/workloads/t0-dispatch.test.mjs
      # M1 exit item 6 (plan v9 rule 26, section 5.6), last so a finding hides no check above:
      # `cargo xtask adr-lint` (tools/xtask/src/adr_lint.rs) over m0-exit..<tip>: ADR trailers,
      # review records, README Counts, path:line drift. <tip> is the PR head on pull_request (a
      # worktree; GitHub's refs/pull/N/merge commit has no trailer), else HEAD. Full history first
      # (the drift part reads old blobs). The output is the item-6 input of `cargo xtask m1-exit`.
      - name: adr-lint
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --unshallow origin
          git fetch --no-tags origin 'refs/tags/m0-exit:refs/tags/m0-exit'
          root=$PWD; if [ -n "$PR_HEAD" ]; then root=$RUNNER_TEMP/pr-head; git worktree add -q --detach "$root" "$PR_HEAD"; fi
          cargo xtask adr-lint --base m0-exit --root "$root" 2>&1 | tee adr-lint.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m1-exit-inputs-adr-lint
          path: adr-lint.txt
          if-no-files-found: warn

  # docs_only for the range of this event: pull_request: merge-base(base, head)..head (--merge-base);
  # push: before..sha, workflow_dispatch: inputs.scope_base..sha, base an ancestor of sha or false
  # (a force-push, no input). The script is an allow-list and fails closed (see its header).
  # Full history, no blobs: the script needs commits and trees only (--no-renames).
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # The fixture ranges of plan v9 section 2.7 (and the fail-closed cases) in a throwaway repo.
      - name: ci-scope self-test
        run: bash .github/scripts/ci-scope.sh --self-test
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.scope_base }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" head="$PR_HEAD" mode=(--merge-base) ;;
            push) base="$PUSH_BEFORE" head="$SHA" mode=() ;;
            workflow_dispatch) base="$DISPATCH_BASE" head="$SHA" mode=() ;;
            *) base="" head="$SHA" mode=() ;;
          esac
          rc=0
          if [ -z "$base" ]; then
            echo "scope: no base for event $EVENT"
            out="docs_only=false"
          else
            out="$(bash .github/scripts/ci-scope.sh "${mode[@]}" "$base" "$head")" || rc=$?
          fi
          case "$out" in
            docs_only=true | docs_only=false) ;;
            *) echo "::error::ci-scope.sh exited $rc and printed '$out'"; out="docs_only=false"; rc=1 ;;
          esac
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "scope ($EVENT, ${base:-no base}..$head): $out" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  build-test:
    name: build + test (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    # Plan v9 section 9.2: 110 (>= 1.5 x 72.0 min, the last measured max with the feature matrix
    # inside) until the first run without it is measured.
    timeout-minutes: 110
    steps:
      # Windows: keep LF in our files and in test262 (scripts break on CRLF), allow long paths.
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The ep9_cli e2e test checks every expected output against node, so pin the plan's named
      # comparator (node 24.22, 10-quality.md), not the runner image's node: node 22 has no
      # Promise.try (ES2025), which jobs/promise_try.js uses (M2-P4-CI-NODE24).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # Spike B's native entry (plan M0 month 2, D21): the ep9_vm `spike-native` tests run
      # native code on every target, Windows x64 included (crates/ep9_vm/src/tests/native.rs).
      # The feature is never in the ep9 graph (dep-guards check 11), so it gets its own build.
      - name: spike-native tests (ep9_vm)
        if: ${{ !cancelled() }}
        run: cargo test -p ep9_vm --features spike-native --locked native
      # 10-quality section 5: clippy -D warnings on all 4 targets (the lint job covers Linux x64).
      - if: ${{ matrix.name != 'linux-x64' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # H27: the default (jit), jitless and aot feature sets, one package at a time (a --workspace
  # build unifies features and would hide a jitless leak): build, clippy -D warnings and test,
  # 9 cells (tools/xtask/src/features.rs). It runs every cell, then lists PASS or FAIL per cell.
  # Its own job since M4-P0 (plan v9 section 2.7, L1): build-test, with this step inside, was the
  # longest job (72.0 min max, windows-x64). The default set's `cargo test -p ep9_cli` runs the e2e
  # check against node, so this job pins the same node as build-test.
  feature-matrix:
    name: feature matrix (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: cargo xtask feature-matrix

  test262:
    name: test262 parse + exec (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 also runs the atom-key gate (a debug exec run). GC-stress runs in the test262-gc
        # job (M3-P3 GATES-2), so this job no longer needs the 300-min limit of M3-P2-CI-GC-TIMEOUT.
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    # Plan v9 section 9.2: 90 on every target (>= 1.5 x 45.0 min, the last measured max).
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The checkout is keyed by the pin and the patch set, so a pin change misses the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/test262
          key: test262-${{ runner.os }}-${{ hashFiles('third_party/test262.commit', 'third_party/patches/test262/**') }}
      - id: sync
        run: bash scripts/sync-test262.sh
      # The benchmark pins, for the corpus digest below (corpus.rs reads all three). JetStream
      # inflates its .z files with node (scripts/sync-bench.sh); the runner images have node.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/bench-octane
            third_party/bench-v8v7
            third_party/bench-jetstream
          key: bench-${{ runner.os }}-${{ hashFiles('third_party/bench-octane.commit', 'third_party/bench-v8v7.commit', 'third_party/bench-jetstream.commit', 'third_party/patches/bench-*/**') }}
      - id: bench
        if: ${{ !cancelled() }}
        run: bash scripts/sync-bench.sh bench-octane bench-v8v7 bench-jetstream
      # Exit 1 on a regression vs expectations/test262-parse.<host-triple>.txt.
      - name: test262 parse
        run: cargo run --release --locked -p ep9_test262 -- parse --json test262-parse.json
      # The engine end to end (tools/test262/README.md "exec"): one worker process per CPU, 20 s
      # soft timeout per run (on an M-series Mac, each run of the 8 sm/Date dst-offset-caching
      # files, among the slowest, takes 0.6-1.5 s, by host load). Exit 1 on a change
      # vs expectations/test262.<host-triple>.jit.txt. Exit 2 on an infrastructure error (panic,
      # timeout, worker crash): no expectation file can list one, so it always fails the job.
      - name: test262 exec
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: cargo run --release --locked -p ep9_test262 -- exec --json test262-exec.json
      # Eager feedback (H16): every function gets its feedback vector at its first call instead of
      # its 8th. The result must not change, so the same expectation file applies.
      - name: test262 exec, eager feedback
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: cargo run --release --locked -p ep9_test262 -- exec --feedback-threshold 0 --json test262-exec-eager.json
      # G1 determinism (decision M2-DETERMINISM): every unit of the bytecodegen corpus (test262
      # plus the 3 benchmark pins, 54,522 files) compiles to the same bytes on every target, in
      # release and in debug. The digest over them must equal expectations/bytecode-corpus.digest
      # (crates/ep9_frontend/src/bytecodegen/corpus.rs). The log prints this runner's digest. It
      # changes only with an ABI bump or a codegen change (a BCG-CORPUS row in decisions-log).
      # The log is an m0-exit input (item 12; CORPUS_CMD in tools/xtask/src/m0_exit.rs): no color,
      # the start line "m0-exit start: <label>" first and the exit-status line
      # "m0-exit status: <code>" last, so a killed run (a start with no status) cannot pass.
      - name: bytecodegen corpus digest (release)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && steps.bench.outcome == 'success' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          echo "m0-exit start: corpus release" | tee corpus-release.log
          rc=0
          cargo test -p ep9_frontend --release --locked --lib bytecodegen::corpus -- --ignored --nocapture 2>&1 | tee -a corpus-release.log || rc=$?
          echo "m0-exit status: $rc" | tee -a corpus-release.log
          exit "$rc"
      - name: bytecodegen corpus digest (debug)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && steps.bench.outcome == 'success' && matrix.name != 'windows-x64' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          echo "m0-exit start: corpus debug" | tee corpus-debug.log
          rc=0
          cargo test -p ep9_frontend --locked --lib bytecodegen::corpus -- --ignored --nocapture 2>&1 | tee -a corpus-debug.log || rc=$?
          echo "m0-exit status: $rc" | tee -a corpus-debug.log
          exit "$rc"
      # M0 exit item 7 (nesting caps, the UTF-16 column): the m0-exit input log of NESTING_CMD
      # (tools/xtask/src/m0_exit.rs), two cargo runs, each with its start and exit-status lines. The
      # build + test job runs the same tests; this log is what m0-exit reads for the host column.
      - name: nesting caps (m0-exit item 7 log)
        if: ${{ !cancelled() && matrix.name != 'windows-x64' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          echo "m0-exit start: depth_tests" | tee nesting.log
          rc1=0
          cargo test --locked -p ep9_frontend --lib depth_tests 2>&1 | tee -a nesting.log || rc1=$?
          echo "m0-exit status: $rc1" | tee -a nesting.log
          echo "m0-exit start: nesting_caps cli" | tee -a nesting.log
          rc2=0
          cargo test --locked -p ep9_cli --test nesting_caps --test cli 2>&1 | tee -a nesting.log || rc2=$?
          echo "m0-exit status: $rc2" | tee -a nesting.log
          [ "$rc1" = 0 ] && [ "$rc2" = 0 ]
      # G2 atom-key gate (W4-KEY-EQ): in a debug build with EP9_ASSERT_ATOM_KEYS=1, every isolate
      # drop panics if a property-key compare looked at string content (crates/ep9_vm/src/atoms.rs),
      # and the runner counts that as a panic. The gate needs "infrastructure errors: 0 (panic 0,
      # ...)" in the summary and exit 0 or 1. Exit 2 means an infrastructure error (panic,
      # timeout, worker crash, internal BytecodeGen error) or a runner error, and fails the step;
      # an infrastructure error also skips the expectation compare (tools/test262/src/exec.rs).
      # Exit 1 (the failing set differs from the expectation file, no infrastructure error) is a
      # warning: the release steps above are the result gates. The 300 s soft timeout is for the
      # slower debug build.
      - name: test262 exec, atom-key gate (debug)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && matrix.name == 'linux-x64' }}
        run: |
          cargo build --locked -p ep9_test262
          rc=0
          EP9_ASSERT_ATOM_KEYS=1 target/debug/ep9-test262 exec --timeout 300 2>&1 | tee atomgate.log || rc=$?
          line="$(grep 'infrastructure errors:' atomgate.log | tail -n 1 || true)"
          if [ -z "$line" ]; then
            echo "::error::atom-key gate: the debug exec run printed no summary (exit $rc)"
            exit 1
          fi
          if ! grep -qE '^ *infrastructure errors: 0 \(panic 0, timeout 0, worker crash 0, other 0\)$' <<< "$line"; then
            echo "::error::atom-key gate (exit $rc):$line"
            exit 1
          fi
          case "$rc" in
            0) ;;
            1) echo "::warning::atom-key gate passed (infrastructure errors 0), but the debug failing set differs from the expectation file (exit 1)" ;;
            *) echo "::error::atom-key gate: the debug exec run exited $rc:$line"; exit 1 ;;
          esac
      # Every failure with its cause; regenerate an expectation file from test262-exec.json
      # (status "fail").
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: test262-exec-${{ matrix.name }}
          path: test262-exec*.json
          if-no-files-found: ignore
      # The host-column inputs of `cargo xtask m0-exit` for this target (M3-P3-DRYRUN-CI): --parse,
      # --exec, --corpus (release, debug), --nesting; the eager run is the T262-EAGER evidence.
      # The GC-stress shards (--exec-gc) are in the m0-exit-inputs-gc-* artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m0-exit-inputs-${{ matrix.name }}
          path: |
            test262-parse.json
            test262-exec.json
            test262-exec-eager.json
            corpus-release.log
            corpus-debug.log
            nesting.log
          if-no-files-found: warn

  # GC-stress (a collection before every allocation, the heap verifier after each) with eager
  # feedback, against the expectation file of each target: M0 exit item 6, on every target
  # (V8-A22: windows-x64 too). One whole run took about 2 h on the hosted 4-CPU linux-x64 runner
  # at M3-P2, so it runs as 6 shards, one job each (M3-P3-GC-SHARD). `cargo xtask m0-exit
  # --gc-shard k/n` prints the test262 path prefixes of shard k: a split of the checkout by file
  # count that puts every test file in exactly one shard. A filtered run compares only the tests
  # it ran (tools/test262 expect::diff), and its JSON names every file it ran (run_paths).
  # m0-exit item 6 checks that each JSON ran and skipped exactly the files of one shard, reads
  # the n JSON files of a target back as one whole-corpus run, and its Windows cell needs every
  # windows-x64 shard job green. The
  # tests of the skip list run past the timeout under GC-stress (its header says why each one is
  # there). A verifier error panics: an infrastructure error, exit 2 (tools/test262/README.md
  # "exec"). To change n, change `shards` and the `shard` list together.
  test262-gc:
    name: test262 GC-stress (${{ matrix.target.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
        shards: [6]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.target.os }}
    # Plan v9 section 9.2: 60 (>= 1.5 x 22.7 min, the last measured max of one shard).
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/test262
          key: test262-${{ runner.os }}-${{ hashFiles('third_party/test262.commit', 'third_party/patches/test262/**') }}
      - run: bash scripts/sync-test262.sh
      - name: test262 exec, GC-stress + eager feedback
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          out="$(cargo xtask m0-exit --gc-shard "$SHARD")"
          set -f
          # shellcheck disable=SC2206 # one prefix per line; no prefix has a space or a glob
          prefixes=($out)
          set +f
          if [ "${#prefixes[@]}" -eq 0 ]; then
            echo "::error::cargo xtask m0-exit --gc-shard $SHARD printed no prefix"
            exit 1
          fi
          echo "shard $SHARD: ${#prefixes[@]} path prefixes"
          cargo run --release --locked -p ep9_test262 -- exec --gc-stress 1 --feedback-threshold 0 \
            --timeout 60 --skip-list expectations/test262-gc-skip.txt --json test262-exec-gc.json \
            "${prefixes[@]}"
      # The --exec-gc input of `cargo xtask m0-exit` (one per shard; pass all n of a target).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: m0-exit-inputs-gc-${{ matrix.target.name }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: test262-exec-gc.json
          if-no-files-found: warn

  # H36 (docs/plan/10-quality.md section 5): what ships calls no libm function and has no FMA
  # instruction outside ep9_math (tools/xtask/src/fpcheck.rs). fp-check builds the post-LTO
  # object of ep9 for the 5 tier-1 targets plus x86_64-unknown-linux-gnu at x86-64-v3, with
  # `-C linker=true`: one Linux host checks every target without target linkers. It reads the
  # objects with llvm-nm and llvm-objdump from llvm-tools.
  fp-check:
    name: fp-check (linux-x64)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install the other 4 targets and llvm-tools
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-pc-windows-msvc
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fp-check
        run: cargo xtask fp-check
      # The fixture tests are #[ignore] in build-test: they need the targets and llvm-tools [I14].
      - name: fp-check fixtures
        if: ${{ !cancelled() }}
        run: cargo test --locked -p xtask --test fpcheck -- --ignored
      # W4-MATH-SOFTFMA: SoftFma equals the hardware FMA (vfmadd) bit for bit on 10^7 inputs plus
      # the edge triples. Hosted x64 runners have FMA; on an x86-64 CPU without it the test
      # compares SoftFma with the C fma instead, and this step says so (aarch64 always has fmadd).
      - name: SoftFma vs hardware FMA
        if: ${{ !cancelled() }}
        run: |
          if [ "$(uname -m)" = x86_64 ] && ! grep -qw fma /proc/cpuinfo; then
            echo "::warning::this runner has no FMA unit: soft_vs_hw compares SoftFma with the C fma, not vfmadd"
          fi
          cargo test --locked -p ep9_math --release soft_vs_hw -- --ignored

  # Disassembly checks of engine crates (docs/plan/10-quality.md section 5; 08-repo section 7).
  # Host target only: each tier-1 target has its own runner, and the machine code depends on the
  # target, not on the host.
  disasm:
    name: disasm checks (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # cargo xtask disasm-check needs llvm-objdump, llvm-nm and llvm-ar from the sysroot.
      - run: rustup component add llvm-tools
      # H15: tail handlers end in tail jumps, handler args <= 4, and every expansion has 284
      # handlers = ep9_vm::internals::THREADED_HANDLERS (opcodes + cold blocks + 3). Change the
      # number when an opcode or a cold block is added. No --match-loop gate for ep9_vm: its
      # match loop is the debug expansion, and its release shape is a report (H15 ADR, Rules).
      - name: ep9_vm handlers
        run: cargo xtask disasm-check --manifest-path crates/ep9_vm/Cargo.toml -p ep9_vm --expect 284
      # SP-Value, H11: the barrier fast path (rustc --emit asm; no llvm-tools needed).
      - name: ep9_heap barrier
        if: ${{ !cancelled() }}
        run: bash crates/ep9_heap/disasm-barrier.sh

  spikes:
    name: spike gates (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # `cargo xtask disasm-check` (gate step 5) needs llvm-objdump, llvm-nm and llvm-ar. It finds
      # them in the sysroot of the pinned toolchain; runner images do not have them on PATH.
      - run: rustup component add llvm-tools
      # SP-Dispatch expansion (c) builds with this nightly (spikes/sp-dispatch/Cargo.toml).
      - run: rustup toolchain install nightly-2026-10-04 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            spikes/sp-dispatch -> target
            spikes/sp-gc -> target
            spikes/sp-jit-mem -> target
            spikes/spike-b -> target
      # H15-Q3: one LLVM for cgoto.c on every target. spikes/sp-dispatch/gate.sh builds it with
      # `zig cc` when `zig version` prints 0.17.0 and logs "cc: zig cc 0.17.0 (pinned, H15-Q3)".
      # The archive is pinned by its SHA-256 from https://ziglang.org/download/index.json
      # (release of 2026-10-01); no third-party action.
      - name: Install zig 0.17.0
        env:
          ZIG_VERSION: 0.17.0
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          exe=""
          case "$MATRIX_NAME" in
            linux-x64) arch=x86_64-linux ext=tar.xz sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
            linux-arm64) arch=aarch64-linux ext=tar.xz sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            macos-arm64) arch=aarch64-macos ext=tar.xz sum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
            windows-x64) arch=x86_64-windows ext=zip sum=b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428 exe=.exe ;;
            *) echo "::error::no zig $ZIG_VERSION archive for $MATRIX_NAME"; exit 1 ;;
          esac
          name="zig-$arch-$ZIG_VERSION"
          tmp="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          curl -sSfL --retry 3 -o "$tmp/$name.$ext" "https://ziglang.org/download/$ZIG_VERSION/$name.$ext"
          if command -v sha256sum > /dev/null; then got="$(sha256sum "$tmp/$name.$ext")"; else got="$(shasum -a 256 "$tmp/$name.$ext")"; fi
          got="${got%% *}"
          if [ "$got" != "$sum" ]; then
            echo "::error::$name.$ext has SHA-256 $got, not $sum"
            exit 1
          fi
          if [ "$ext" = zip ]; then 7z x -bd -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/$name.$ext" > /dev/null; else tar -xJf "$tmp/$name.$ext" -C "$tmp"; fi
          "$tmp/$name/zig$exe" version
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # Structural gates block (build, tests, agreement, tail exits, handler args, x64 match-loop
      # shape). Speed gates are recorded, not blocking: one hosted x64 label gave 4 CPU models,
      # and the verdict changes with the model (H15 ADR; docs/measurements/2026-10-21-sp-dispatch-x64.md).
      # They show as warnings, in the job summary and in the artifact (bench.json). 31 rounds is
      # the hosted-runner minimum of the speed-gate rule (docs/plan/10-quality.md section 3).
      - name: SP-Dispatch gate
        env:
          SP_SPEED: report
          SP_ROUNDS: "31"
        run: bash spikes/sp-dispatch/gate.sh
      - name: SP-GC gate
        if: ${{ !cancelled() }}
        run: bash spikes/sp-gc/gate.sh
      # Host target only (SP_JIT_EXTRAS=0): the Rosetta and Windows cross-build extras are for a
      # local Mac; each tier-1 target has its own runner here.
      - name: SP-JIT-mem gate
        if: ${{ !cancelled() }}
        env:
          SP_JIT_EXTRAS: "0"
        run: bash spikes/sp-jit-mem/gate.sh
      # Spike B structural gate (plan-v4 P2-SPIKE-B task 4): spike unit tests, `spike-b structural all`
      # in the release (panic = abort) build, then check (h) in the debug (panic = unwind) build.
      # Every check has a Windows path (UNWIND_INFO through FunctionTableRegistration; check (h)
      # expects exit code 0xC0000409 there), so no check is skipped on windows-x64.
      - name: Spike B structural gate
        if: ${{ !cancelled() }}
        run: bash spikes/spike-b/gate.sh structural
      # Spike B placement (b) gate (plan-v6 P4-PLACEMENT-B, D11): the jit_b unit tests, then
      # `spike-b structural-b all` (release) and `structural-b h` (debug). Placement (b) is built
      # for AArch64 and x86-64 (M3-P0 P0-B-X64), so a SKIP line fails the step on every runner
      # here (P0-D9).
      - name: Spike B placement (b) gate
        if: ${{ !cancelled() }}
        run: bash spikes/spike-b/gate.sh b
      # SP-Unit gate (M3-P1 SP-UNIT, SPIKEB(unit)): the 11 Spike B opcodes as AOT unit text on
      # placement (b), with 0 relocations, the unit-data register x27/r14, a per-isolate RW copy
      # with its root ranges, 2 isolates on 2 threads, the unwind self-test and every fallback
      # (checks (a)-(g); docs/measurements/2026-10-23-sp-unit.md). A SKIP line fails it. It runs
      # on every runner: SP-UNIT proved it on mac a64, linux a64, linux x64 (sandbox) and
      # windows-x64 (CI probe run 39886596197, V8-A6).
      - name: Spike B unit gate
        if: ${{ !cancelled() }}
        run: bash spikes/spike-b/gate.sh unit
      # P4-WIN-STATIC-1 (plan-v6 D25): the real Win64 unwind run of the x86-64 JIT of placement
      # (a) (drive, id, hold) and, since M3-P0 P0-B-X64, placement (b) (bdrive, bid, bhold)
      # (spikes/spike-b/tests/win64_unwind.rs): per function, RtlLookupFunctionEntry finds its
      # RUNTIME_FUNCTION and RtlVirtualUnwind from every prologue, body and epilogue state
      # returns to its caller ((b) epilogues end in `rex.w jmp [rdi + rax*8]`); a walk from a
      # host function steps through running JIT frames.
      # The `cargo test` of the structural gate already runs it; this step names the result.
      # Debug, as that `cargo test`, so it reuses its build (a --release test build would
      # rebuild the fat-LTO graph). The static half (win-static.sh, llvm-readobj and llvm-mc)
      # runs on a Mac.
      - name: Spike B Win64 unwind (windows-x64)
        if: ${{ !cancelled() && matrix.name == 'windows-x64' }}
        run: cargo test --locked --manifest-path spikes/spike-b/Cargo.toml --test win64_unwind -- --nocapture
      # M3-P2 WIN-STATIC-2: the Win64 unwind data of SP-Unit x86-64 unit text
      # (spikes/spike-b/tests/win64_unit.rs). Here the spike loader maps units A and B and
      # registers their function table; per function (JS functions, probe, cell reader),
      # RtlLookupFunctionEntry finds the unit's UNWIND_INFO and RtlVirtualUnwind from every
      # prologue, body and epilogue state returns to the caller; a unit with a broken
      # UNWIND_INFO fails. The static checks of the same file (codes against the decoded
      # prologue, a model unwinder, llvm-readobj) run on every runner in the structural gate's
      # `cargo test`. Debug, as the step above, so it reuses that build.
      - name: SP-Unit Win64 unwind (windows-x64)
        if: ${{ !cancelled() && matrix.name == 'windows-x64' }}
        run: cargo test --locked --manifest-path spikes/spike-b/Cargo.toml --test win64_unit -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sp-dispatch-gate-${{ matrix.name }}
          path: spikes/sp-dispatch/target/gate/
          if-no-files-found: warn
      # H15-Q2 (M3-P2 PERF3; WIN-STATIC-2 task 3): the Zen 3 branchy study, report only. PERF3's
      # spikes/sp-dispatch/zen3-branchy.sh (no arguments; exit 0 unless the build fails) prints
      # the CPU model and the sysv and win64 ratio of each kernel. Hosted x64 runners draw
      # different CPU models (EPYC 7763 is Zen 3), so the log starts with the runner's CPU model
      # and is kept as an artifact for the H15-Q2 row. It never fails the job.
      - name: SP-Dispatch Zen 3 branchy report (x64)
        if: ${{ !cancelled() && (matrix.name == 'linux-x64' || matrix.name == 'windows-x64') }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          log="spikes/sp-dispatch/target/zen3/zen3-branchy-$MATRIX_NAME.log"
          mkdir -p "$(dirname "$log")"
          if [ "$MATRIX_NAME" = windows-x64 ]; then
            cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' | tr -d '\r' || true)"
          else
            cpu="$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1 || true)"
          fi
          printf 'runner: %s\ncpu model: %s\ncommit: %s\n' "$MATRIX_NAME" "${cpu:-unknown}" "$GITHUB_SHA" | tee "$log"
          echo "Zen 3 branchy report ($MATRIX_NAME): CPU ${cpu:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f spikes/sp-dispatch/zen3-branchy.sh ]; then
            echo "::warning::spikes/sp-dispatch/zen3-branchy.sh is missing" | tee -a "$log"
            exit 1
          fi
          bash spikes/sp-dispatch/zen3-branchy.sh 2>&1 | tee -a "$log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (matrix.name == 'linux-x64' || matrix.name == 'windows-x64') }}
        with:
          name: zen3-branchy-${{ matrix.name }}
          path: spikes/sp-dispatch/target/zen3/
          if-no-files-found: warn

  # Miri on the unsafe code of ep9_value, ep9_heap and ep9_math (docs/plan/10-quality.md
  # section 5, sanitizers; ep9_math: the FMA dispatch in exact.rs). The plan runs it nightly; it
  # runs on every PR until the nightly trigger lands. The crates skip what Miri cannot run (the
  # conservative stack scan) and the slow tests (cfg_attr(miri, ignore)). The nightly is the
  # pinned one of the become feature.
  miri:
    name: Miri (linux-x64)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The +toolchain override wins over rust-toolchain.toml, so the stable pin is not needed.
      - run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src --no-self-update
      - run: cargo "+$MIRI_TOOLCHAIN" miri setup
      - run: cargo "+$MIRI_TOOLCHAIN" miri test --locked -p ep9_value -p ep9_heap -p ep9_math

  dep-guards:
    name: dependency guards
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: bash .github/scripts/dep-guards.sh
      # Licence and ban rules of deny.toml (docs/plan/12-governance.md section 1). The release
      # binary is pinned by version and SHA-256 (the digest that GitHub and the release's .sha256
      # file give); no third-party action and no build.
      - name: Install cargo-deny
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: cargo deny --locked check licenses bans

  # perf CI v0 (docs/plan/10-quality.md section 2; tools/bench/README.md "perf CI v0"): the
  # instructions of t0-loop, t0-branchy, t0-call, t0-prop, ci-v0 and the generated v8-v7
  # richards and deltablue under cachegrind (user mode; one counter on every run, never perf).
  # The script first checks each workload's output: a wrong answer gets no count and fails the
  # job. It fixes EP9_HASH_SEED, so a re-run on the same commit gives the same counts. One JSON
  # (schema ep9-perf-ci/v1, with every ep9-bench/v1 report and the commit) as the artifact, and
  # the table in the step summary. A record, not a gate: the ratchet comes later.
  perf-ci-v0:
    name: perf CI v0 (linux-x64)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install valgrind (cachegrind)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
      # richards and deltablue: tools/bench/cross/v8v7.mjs writes them from this pinned checkout.
      - run: bash scripts/sync-bench.sh bench-v8v7
      - run: cargo build --release --locked -p ep9_bench -p ep9_cli
      - name: Count instructions
        id: count
        run: >-
          node .github/scripts/perf-ci-v0.mjs --ep9 target/release/ep9 --bench target/release/ep9-bench
          --counter cachegrind --runs 3 --warmup 0 --out perf-ci-v0.json --md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.count.outcome != 'skipped' }}
        with:
          name: perf-ci-v0-${{ github.sha }}
          path: perf-ci-v0.json
          if-no-files-found: error

  # SP-tsrs-win (docs/plan/08-repo.md section 5 item 7; 09-milestones section 4): the result is
  # recorded in the job summary and an artifact. It never blocks (continue-on-error).
  sp-tsrs-win:
    name: SP-tsrs-win (recorded, not blocking)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tsrs's rust-toolchain.toml names the same channel as ours (D8); sync-tsrs.sh runs cargo +<it>.
      - uses: ./.github/actions/setup-rust
      - name: Sync tsrs (pin + patches)
        run: |
          set -euo pipefail
          root="$PWD"
          . scripts/sync-lib.sh
          sync_dep tsrs https://github.com/oxc-project/tsrs.git
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: third_party/tsrs -> target
      - name: Build tsrs_cli
        run: bash scripts/sync-tsrs.sh 2>&1 | tee sp-tsrs-win.log
      - name: Smoke tests
        run: bash .github/scripts/tsrs-smoke.sh third_party/tsrs/target/release/tsrs.exe 2>&1 | tee -a sp-tsrs-win.log
      - name: Record the result
        if: ${{ always() }}
        run: |
          {
            echo "## SP-tsrs-win"
            echo "tsrs pin: $(cat third_party/tsrs.commit)"
            echo '```'
            tail -n 40 sp-tsrs-win.log 2> /dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: sp-tsrs-win-log
          path: sp-tsrs-win.log
          if-no-files-found: warn

  # Front-end fuzz smoke (plan v9 M4-P2 FE-FUZZ; docs/plan/10-quality.md section 4): the 3
  # cargo-fuzz targets of fuzz/ (its own nightly workspace, fuzz/README.md), seeded from
  # fuzz/seeds and a test262 sample, FUZZ_SMOKE seconds of mutation each. The repo is public
  # (plan v9 rule 14, V9-A17): fuzz/scripts/run.sh sends the fuzzer output to a file inside the
  # job and prints only the crash count, the SHA-256 of each crash file and numeric stats; the
  # job uploads nothing. The self-test step first proves that rule on a fixture crash. A CI
  # probe of the 10-minute smoke sets frontend_compile=600 (and the timeout to 45).
  # Rule 25: the Mac run of every step except the mutation is 172 s (cold build in the
  # self-test 102 s, test262 seeds 57 s, seed replay 11 s) + 180 s mutation = 5.9 min; on
  # ubuntu-24.04 (4 vCPU, cold cache, cargo-fuzz install) about 12-15 min (est.).
  fuzz-smoke:
    name: fuzz smoke (linux-x64)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # Plan v9 section 9.2: 30 (new job; the fixer re-reads it from the first measured run).
    timeout-minutes: 30
    env:
      CARGO_FUZZ_VERSION: 0.12.0
      # <target>=<seconds of mutation>, one per target.
      FUZZ_SMOKE: frontend_compile=60 function_ctor=60 eval_context=60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The +toolchain of fuzz/rust-toolchain.toml (the Miri pin); the root stable pin builds
      # cargo-fuzz itself.
      - uses: ./.github/actions/setup-rust
      - name: Install the fuzz nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: |
          chan="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$chan" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/test262
          key: test262-${{ runner.os }}-${{ hashFiles('third_party/test262.commit', 'third_party/patches/test262/**') }}
      - run: bash scripts/sync-test262.sh
      - name: Seed corpus (test262 sample)
        run: bash fuzz/scripts/seed-test262.sh third_party/test262 fuzz/corpus
      - name: Output rule self-test (a fixture crash shows only the count and the hash)
        run: bash fuzz/scripts/self-test.sh
      - name: Build the targets
        run: bash fuzz/scripts/run.sh build
      - name: Fuzz smoke
        run: |
          rc=0
          for item in $FUZZ_SMOKE; do
            t="${item%%=*}"
            s="${item#*=}"
            bash fuzz/scripts/run.sh "$t" "$s" "fuzz/corpus/$t" "fuzz/seeds/$t" || rc=1
          done
          exit "$rc"
