# Front-end cargo-fuzz campaigns (plan v9 V9-D24; docs/plan/10-quality.md section 4: the
# front-end budget is 24 CPU-h at M1). Dispatch only; the orchestrator runs it (plan v9 rule 3).
#
#   one job per target x runner: seeds (fuzz/seeds + a test262 sample) -> cargo fuzz run
#   -fork=<jobs> for <seconds> -> crash count + SHA-256 per crash file -> one ep9-fuzz/v1
#   record (fuzz/scripts/record.sh), the m1-exit item 5 input
#
# The repo is public (plan v9 rule 14, V9-A17): fuzz/scripts/run.sh sends the fuzzer output
# to a file inside the job and prints only the crash count, the hashes and numeric stats. The
# job uploads only the record JSON (names, numbers, hashes: commit, dirty, CPU-h, executed
# units, crash ids): no crash input, no corpus, no log. A crash fails the job with a fixed text;
# the input is reproduced off GitHub (on a fuzz box, plan v10 V10-D26), never from this job.
# The self-test step proves the output rule and the record rule before each campaign.
#
# The record (plan v10 §2.7, CX6-1): campaign gh<run id>-<attempt>-<target>; commit = the
# checked-out HEAD; dirty = a tracked file differed from HEAD before the build or after the run
# (`git status --porcelain --untracked-files=no`); cpu_hours = the MEASURED run seconds x jobs /
# 3600 (the fork workers run all the time), so a run cut short counts what it ran; counted =
# the `counted` input. Default: 3 targets x 2 h x 4 workers = 24 CPU-h. A counted run is
# pre-registered: a decisions-log row names the tool, campaign and tree before the dispatch
# (plan v10 rule 41); a bug-finding run keeps the default `counted: false`.
name: fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "mutation time per job, in seconds (at most 19800: the 360-min job limit)"
        required: true
        default: "7200"
        type: string
      jobs:
        description: "libFuzzer -fork workers per job (the runner has 4 vCPU)"
        required: true
        default: "4"
        type: string
      runner:
        description: "runner image"
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
      max_len:
        description: "libFuzzer -max_len (deep nesting forms need about 20000-120000 bytes to reach the caps)"
        required: true
        default: "4096"
        type: string
      counted:
        description: "a counted run (m1-exit item 5): only with a decisions-log row first (plan rule 41)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_FUZZ_VERSION: 0.12.0

defaults:
  run:
    shell: bash

jobs:
  campaign:
    name: cargo-fuzz ${{ matrix.target }} (${{ inputs.runner }})
    strategy:
      fail-fast: false
      matrix:
        target: [frontend_compile, function_ctor, eval_context]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        env:
          SECONDS_IN: ${{ inputs.seconds }}
          JOBS_IN: ${{ inputs.jobs }}
          MAX_LEN_IN: ${{ inputs.max_len }}
        run: |
          for v in "$SECONDS_IN" "$JOBS_IN" "$MAX_LEN_IN"; do
            case "$v" in '' | *[!0-9]*) echo "::error::not a number: $v"; exit 1 ;; esac
          done
          [ "$SECONDS_IN" -le 19800 ] || { echo "::error::seconds > 19800"; exit 1; }
          [ "$JOBS_IN" -ge 1 ] && [ "$JOBS_IN" -le 16 ] || { echo "::error::jobs not in 1..16"; exit 1; }
      # The root stable pin builds cargo-fuzz; fuzz/rust-toolchain.toml builds the targets.
      - uses: ./.github/actions/setup-rust
      - name: Install the fuzz nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: |
          chan="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$chan" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/test262
          key: test262-${{ runner.os }}-${{ hashFiles('third_party/test262.commit', 'third_party/patches/test262/**') }}
      - run: bash scripts/sync-test262.sh
      - name: Seed corpus (test262 sample)
        run: bash fuzz/scripts/seed-test262.sh third_party/test262 fuzz/corpus
      - name: Output rule self-test (a fixture crash shows only the count and the hash)
        run: bash fuzz/scripts/self-test.sh
      # The source state of the fuzzed tree: the tracked files before the build (the Summary
      # step checks them again after the run).
      - name: Source state
        run: |
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/ep9-dirty-before"
          echo "commit $(git rev-parse HEAD), $(wc -l < "$RUNNER_TEMP/ep9-dirty-before" | tr -d ' ') changed tracked file(s)"
      - name: Build the targets
        run: bash fuzz/scripts/run.sh build
      - name: Campaign
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_IN: ${{ inputs.seconds }}
          FUZZ_FORK: ${{ inputs.jobs }}
          FUZZ_MAX_LEN: ${{ inputs.max_len }}
          FUZZ_SUMMARY: fuzz-summary.json
        run: bash fuzz/scripts/run.sh "$TARGET" "$SECONDS_IN" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET"
      # The ep9-fuzz/v1 record: names, numbers and hashes only (record.sh refuses any other
      # string). With no run summary (the campaign step did not end) the record says 0 s and
      # counted false.
      - name: Summary
        if: ${{ always() }}
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_IMAGE: ${{ inputs.runner }}
          JOBS_IN: ${{ inputs.jobs }}
          COUNTED: ${{ inputs.counted }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          before="$RUNNER_TEMP/ep9-dirty-before"
          if [ ! -f "$before" ]; then
            dirty=unknown
          elif [ -s "$before" ] || [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            dirty=true
          else
            dirty=false
          fi
          args=(--tool cargo-fuzz --campaign "gh$RUN_ID-$RUN_ATTEMPT-$TARGET" --target "$TARGET"
            --commit "$(git rev-parse HEAD)" --dirty "$dirty" --counted "$COUNTED" --runner "$RUNNER_IMAGE")
          if [ -f fuzz-summary.json ]; then
            args+=(--run fuzz-summary.json)
          else
            args+=(--seconds 0 --workers "$JOBS_IN" --uncounted "no run summary: the campaign step did not end")
          fi
          bash fuzz/scripts/record.sh "${args[@]}" --out "fuzz-record-$TARGET.json"
          { echo "## cargo-fuzz $TARGET (ep9-fuzz/v1)"; echo '```'; cat "fuzz-record-$TARGET.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: fuzz-record-${{ matrix.target }}
          path: fuzz-record-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 90
