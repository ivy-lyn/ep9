[package]
name = "t262h-oxc"
version = "0.1.0"
edition = "2024"
publish = false

# oxc-only build of ../harness/src/main.rs: without tsrs, so unicode-id-start is not forced to tsrs's `=1.1.2` pin.
[workspace]

[[bin]]
name = "t262h-oxc"
path = "../harness/src/main.rs"

[dependencies]
oxc_parser = { version = "=0.155.0", optional = true }
oxc_allocator = { version = "=0.155.0", optional = true }
oxc_span = { version = "=0.155.0", optional = true }
oxc_semantic = { version = "=0.155.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["oxc"]
tsrs = []
oxc = ["dep:oxc_parser", "dep:oxc_allocator", "dep:oxc_span", "dep:oxc_semantic"]

[profile.release]
opt-level = 3
debug = 1
panic = "unwind"
codegen-units = 16
