# H36 (docs/adr/H36-fp-semantics.md): one Rust Math, no platform libm, no FMA.
# Engine code calls ep9_math. Only crates/ep9_math may #[allow(clippy::disallowed_methods)],
# and only on its fma helper. A tool crate (tools/*) may allow it at crate level for statistics
# that never reach JS. Exact ops stay allowed: sqrt, abs, floor, ceil, trunc, round,
# round_ties_even, fract, copysign, min, max, to_degrees, to_radians.
disallowed-methods = [
  # f64: platform libm (results differ by OS, CPU and libm version).
  { path = "f64::sin", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::cos", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::tan", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::sin_cos", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::asin", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::acos", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::atan", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::atan2", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::sinh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::cosh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::tanh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::asinh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::acosh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::atanh", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::exp", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::exp2", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::exp_m1", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::ln", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::ln_1p", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::log", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::log2", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::log10", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::cbrt", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::hypot", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::powf", reason = "H36: platform libm. Use ep9_math" },
  { path = "f64::powi", reason = "H36: compiler-rt __powi helper, not correctly rounded. Use ep9_math::pow_js" },
  { path = "f64::rem_euclid", reason = "H36: lowers to C fmod. Use ep9_math::fmod" },
  { path = "f64::div_euclid", reason = "H36: lowers to C fmod. Use ep9_math" },
  # f64: FMA sources.
  { path = "f64::mul_add", reason = "H36: FMA. Only ep9_math::exact::fma_exact may use it" },
  { path = "f64::algebraic_add", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f64::algebraic_sub", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f64::algebraic_mul", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f64::algebraic_div", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f64::algebraic_rem", reason = "H36: allows FMA contraction and reassociation" },
