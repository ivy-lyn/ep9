  # f32: FMA sources.
  { path = "f32::mul_add", reason = "H36: FMA. Only ep9_math::exact::fma_exact may use it" },
  { path = "f32::algebraic_add", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f32::algebraic_sub", reason = "H36: allows FMA contraction and reassociation" },
  { path = "f32::algebraic_mul", reason = "H36: allows FMA contraction and reassociation" },
