# cargo-deny configuration (docs/plan/08-repo.md section 7 "cargo deny"; licence rules: docs/governance.md section 1).
# Only the licence check is configured here. `cargo deny check licenses` must pass on every PR.

[graph]
all-features = true

[licenses]
# An OR expression passes when one side is allowed (for example "Apache-2.0 OR GPL-2.0-only").
# Add an id only when a crate in the graph needs it, in the PR that adds the crate.
# Never allowed: GPL, LGPL (malachite, rug), AGPL, SSPL. MPL-2.0 needs a per-crate exception
# (file-level copyleft).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates have publish = false. They still declare license.workspace = true.
ignore = true
