# Reference shell pins (docs/plan/09-milestones.md section 8 week 1; docs/plan/10-quality.md section 2).
# scripts/sync-shells.sh reads this file and installs the shells into third_party/shells/ (git-ignored).
#
# Format rule: string values only, one `key = "value"` per line, so that the bash script can read
# it with awk. Platform ids: darwin_arm64, linux_x64, linux_arm64, windows_x64 (D2 tier-1 targets).
# A platform with no asset or jsvu_os entry is not supported for that shell.
# Checksums come from the vendor's SHASUMS256.txt (node, bun) or from the vendor zip (d8).

[node]
# "V8 full", "Maglev cap" (--max-opt=2) and "jitless" comparators. Built WITHOUT pointer compression [P1].
version = "24.22.0"
base_url = "https://nodejs.org/dist/v24.22.0/"
pointer_compression = "false"
asset_darwin_arm64 = "node-v24.22.0-darwin-arm64.tar.gz"
sha256_darwin_arm64 = "6a9724d9b50a5f22b4816cded441b5a8d9ddae546191a5e5b7efa5a5e2ee26d5"
asset_linux_x64 = "node-v24.22.0-linux-x64.tar.gz"
sha256_linux_x64 = "28ea0a438de9a13bd7891fd758eee6c7819ee8af5442dfd8d45bd65e56d4228c"
asset_linux_arm64 = "node-v24.22.0-linux-arm64.tar.gz"
sha256_linux_arm64 = "b7e7991d5407815adfa74a2a9cd4db683552c8ce32ff4a295c22e972849c3f5d"
asset_windows_x64 = "node-v24.22.0-win-x64.zip"
sha256_windows_x64 = "f9683a19877e12a9b167305c8db71040d812876359de21f0d2e97c3f321f80c3"

[d8]
# V8 canary build through jsvu. Pointer-compressed (G7 compares with "a pointer-compressed d8 --jitless").
# jsvu 3.0.6 has no linux-arm64 V8 build, so Linux arm64 has no d8 here.
version = "15.8.24"
jsvu_version = "3.0.6"
pointer_compression = "true"
jsvu_os_darwin_arm64 = "mac64arm"
sha256_darwin_arm64 = "cb9b1d5a34ed9c0ab108174d83289eba2682fc7b34a81a1630806adefc26a452"
jsvu_os_linux_x64 = "linux64"
sha256_linux_x64 = "95d0d443db4fad4d5e9441ed31ecfabffd3bb44876df4343dcd42fe1ed20202f"
jsvu_os_windows_x64 = "win64"
sha256_windows_x64 = "8c1b7f766e4f42dc394e9fa134dbb9f725f8f9d350f32a7194cef55ef5b69a9c"

[quickjs]
# Release 2026-06-04 = the "new release" commit that set VERSION to 2026-06-04. The repo has no tags.
# Built from source with `make qjs` (unix only).
version = "2026-06-04"
repo = "https://github.com/bellard/quickjs.git"
commit = "3d5e064e9dd67c70f7962836505a7fa067bf0a4e"

[bun]
# JavaScriptCore comparator (useJIT=0 via BUN_JSC_useJIT=0).
version = "1.4.3"
base_url = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/"
asset_darwin_arm64 = "bun-darwin-aarch64.zip"
sha256_darwin_arm64 = "80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403"
asset_linux_x64 = "bun-linux-x64.zip"
sha256_linux_x64 = "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
asset_linux_arm64 = "bun-linux-aarch64.zip"
sha256_linux_arm64 = "efa9813da5ed72423bf847f916e8d2c47c0d776add972354026a75e10da9aa21"
asset_windows_x64 = "bun-windows-x64.zip"
sha256_windows_x64 = "0bf84e808552beea67bf1202a287a35c6c825d837b287b3f8e9dd513dba35d3d"

