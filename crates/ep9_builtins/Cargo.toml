[package]
name = "ep9_builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Builtins reach the engine only through ep9_vm's builtin ABI (H20), plus ep9_math for Math:
# .github/scripts/dep-guards.sh check 8.
[dependencies]
ep9_math = { path = "../ep9_math" }
ep9_vm = { path = "../ep9_vm" }

# Tests compile JS and run it on an isolate.
[dev-dependencies]
ep9_bytecode = { path = "../ep9_bytecode" }
# The facts-export test (`tests/facts_export.rs`, M3-P3; V8-A12).
ep9_facts = { path = "../ep9_facts" }
ep9_frontend = { path = "../ep9_frontend" }
ep9_heap = { path = "../ep9_heap" }

[lints]
workspace = true
