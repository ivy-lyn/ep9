[package]
name = "ep9_heap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ep9_value = { path = "../ep9_value" }
# The cage (H7), stack bounds and spill trampolines for the conservative scan (H10).
ep9_platform = { path = "../ep9_platform" }

[lints]
workspace = true

# loom runs the parallel mark's work structure under every interleaving (src/tests/loom.rs):
# RUSTFLAGS="--cfg loom" cargo test --release -p ep9_heap --lib tests::loom. Only that build
# compiles it; Cargo.lock lists it for every build.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"
