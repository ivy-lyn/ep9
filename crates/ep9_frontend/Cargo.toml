[package]
name = "ep9_frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The only crate that imports oxc (H1). Exact pins live in the root workspace.dependencies.
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
# The AST visitor (depth pass, scope pass). oxc_semantic already pulls it in at the same version.
# Exact pin here until the root workspace.dependencies lists it (open item for the lead).
oxc_ast_visit = "=0.155.0"
# BytecodeGen emits units with the ep9_bytecode builder and verifier (zero-dep crate).
ep9_bytecode = { path = "../ep9_bytecode" }

[lints]
workspace = true
