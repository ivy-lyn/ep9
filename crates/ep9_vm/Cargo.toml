[package]
name = "ep9_vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Engine crates only. No crates.io dependencies (08-repo section 2).
[dependencies]
ep9_bytecode = { path = "../ep9_bytecode" }
# The facts exporter (`facts_export.rs`, `ep9_vm::abi::export_facts`; M3-P0 V8-A13).
ep9_facts = { path = "../ep9_facts" }
ep9_heap = { path = "../ep9_heap" }
# `**`, Math and `%` use the one Rust Math (H36).
ep9_math = { path = "../ep9_math" }
ep9_platform = { path = "../ep9_platform", features = ["unwind"] } # unit unwind data, jit or not (H27-Q3)
# RegExp backends (RX0: regress). ep9_vm is the only crate that depends on ep9_regexp; builtins
# reach it through Cx part-2 methods (.github/scripts/dep-guards.sh check 14).
ep9_regexp = { path = "../ep9_regexp" }
ep9_value = { path = "../ep9_value" }
# BigInt digits (dashu now, the V8 `src/bigint` port at M8). ep9_vm is the only crate that
# depends on ep9_bigint (.github/scripts/dep-guards.sh check 17).
ep9_bigint = { path = "../ep9_bigint" }

[features]
# H27: runtime codegen. ep9_cli turns it on by default; the jitless ep9 builds without it.
jit = ["ep9_platform/jit"]
# H15 expansion (c): handlers end in `become` (guaranteed tail calls). Needs a nightly toolchain
# with `explicit_tail_calls` (D8: opt-in). Stable builds have the match loop and sibling calls.
become = []
# Spike B (M0 month 2; docs/measurements/2026-10-22-spike-b-protocol.md): the native-entry path
# for spike-made code in T0's call path. Implies `jit`. Only spikes/spike-b and spikes/spike-c turn
# it on; never in the ep9 graph (.github/scripts/dep-guards.sh check 11).
spike-native = ["jit"]
# Inline-cache hit and miss counters (H16), for reports. Off in every shipped build; never in the
# ep9 graph (.github/scripts/dep-guards.sh check 11).
ic-stats = []
# FASTDIFF hit counters (route P0-FASTHITS): each Switch human fast path counts the times it is
# taken, so the FASTDIFF report shows that it ran. Only the ep9_builtins dev-dependency turns it
# on (the FASTDIFF test); never in the ep9 graph (.github/scripts/dep-guards.sh check 11).
fastdiff-hits = []

[lints]
workspace = true
