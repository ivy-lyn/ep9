[package]
name = "ep9_intl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Intl (ECMA-402 on ICU4X; INTL-I1-D1, layout B): glue from the Cx builtin ABI (H20) to ICU4X.
# `#![forbid(unsafe_code)]`; the heap only through ep9_vm's Cx. ep9_builtins lists its modules
# in ep9_builtins::MODULES. Edges: .github/scripts/dep-guards.sh checks 24-26. ep9_intl reads
# Temporal objects and the tz data only through ep9_temporal's pub API (std types): no
# temporal_rs, timezone_provider or zoneinfo64 edge of any kind (check 19, INTL-I1-D9).
[dependencies]
ep9_temporal = { path = "../ep9_temporal" }
ep9_vm = { path = "../ep9_vm" }
# The ICU4X 2.4.x components (INTL-I1-D5, INTL-V2-D4); the features are in the root Cargo.toml.
icu_calendar = { workspace = true }
icu_casemap = { workspace = true }
icu_collator = { workspace = true }
icu_normalizer = { workspace = true }
icu_datetime = { workspace = true }
icu_decimal = { workspace = true }
icu_experimental = { workspace = true }
fixed_decimal = { workspace = true }
icu_list = { workspace = true }
icu_locale = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
icu_provider = { workspace = true }
icu_segmenter = { workspace = true }
icu_time = { workspace = true }
# The search-collation table (INTL-V2-D17 Form A, INTL-W4-CLDR; W4 COLLATOR-SEARCH writes it in
# src/cldr/gen/collator_search) is ICU4X baked data: its DataProvider impl needs the root
# `icu_provider` feature `baked` (on already through icu_collator's `compiled_data`; the root
# line names it), and its code names `zerovec::ZeroVec`. zerovec is in the graph already (every
# icu crate) and in the check 24 list of ep9_intl edges, so no new package.
zerovec = { version = "0.11.9", default-features = false }
# The search table builds its CollationData tries with the checked constructor
# `icu_collections::codepointtrie::CodePointTrie::try_new` (collator.rs `search`; the crate has
# no `unsafe`, so not the baked form). icu_collections 2.4.0 is in the graph already (through
# icu_collator), so no new package; dep-guards check 24 lists it (M6-ORCH-673).
icu_collections = { version = "=2.4.0", default-features = false }
# formatRangeToParts reads the source of each part ("startRange", "endRange", "shared") from
# the ICU4X range parts RANGE_START and RANGE_END of a FormattedDateRange, which has only the
# Writeable trait: its sink is a writeable::PartsWrite (INTL W5, DL INTL-W5-CARGO). writeable
# 0.6.4 is in the graph already (icu_datetime, with default-features = false, as here) and in
# the check 24 list of ep9_intl edges, so no new package.
writeable = { version = "0.6.4", default-features = false }

# The tests run JS on an isolate with ep9_builtins::TABLE (which lists this crate's modules).
[dev-dependencies]
ep9_builtins = { path = "../ep9_builtins" }
ep9_frontend = { path = "../ep9_frontend" }
ep9_heap = { path = "../ep9_heap" }

[lints]
workspace = true
