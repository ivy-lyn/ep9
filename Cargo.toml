[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# Every directory that the member globs match needs a Cargo.toml, hidden directories included:
# one without it makes every cargo command fail ("failed to load manifest for workspace member").
# A tool that is not a Rust crate (a Python oracle, for example) goes into `exclude`.
# .github/scripts/dep-guards.sh check 0 enforces this.
# Required (docs/plan/08-repo.md section 1):
# - third_party: path deps under the root would become members, and oxc patch paths point there.
# - fuzz: own workspace on nightly.
# - tools/ep9-typecheck: own [workspace] with tsrs's exact lock; never part of the engine graph.
# - spikes: throwaway code, each spike has its own empty [workspace].
# - tools/calprobe: own [workspace] with a copy of this lock; the icu_calendar runtime probe
#   (INTL-I1-D2), run at each icu_calendar bump; never part of the engine graph.
exclude = ["third_party", "fuzz", "tools/ep9-typecheck", "spikes", "tools/calprobe"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# D1 = E: oxc from crates.io with exact pins. Only ep9_frontend imports oxc.
# Bump all of them together, one bump PR at a time (08-repo section 6).
# List only crates that a member uses (newer cargo warns on unused ones); transitive oxc crates (oxc_syntax, ...) stay pinned by Cargo.lock and --locked.
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_diagnostics = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_regular_expression = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
# RX0 (docs/decisions-log.md M4-PLAN-D15): the RegExp backend of ep9_regexp, exact pin. Only
# ep9_regexp imports it, and only ep9_vm depends on it (.github/scripts/dep-guards.sh check 14).
# Since M5-P0 the build uses the fork: [patch.crates-io] at the end of this file points at the
# git-ignored checkout third_party/regress (scripts/sync-regress.sh; third_party/patches/regress).
regress = "=0.12.0"
# BigInt digits (plan 06 §4-§5: dashu first, the V8 `src/bigint` port at M8), exact pin. Only
# ep9_bigint imports it, and only ep9_vm depends on ep9_bigint (dep-guards check 17).
dashu-int = { version = "=0.6.2", default-features = false }
# Temporal (plan Q2; design SPEC-T-D12, D13, D19), exact pins. Only ep9_temporal imports them
# (dep-guards checks 18-20). No `sys`, `sys-local` or `compiled_data` (= the `tzif` provider,
# wrong offsets at 0.2.6, temporal_rs issue 759): the clock and the host zone come through Cx,
# and the zone data is ICU zoneinfo64.res in crates/ep9_temporal/data.
temporal_rs = { version = "=0.2.6", default-features = false }
timezone_provider = { version = "=0.2.6", default-features = false }
zoneinfo64 = { version = "=0.3.0", default-features = false }
# H36 (design SPEC-T-D19): temporal_rs reaches libm through core_maths. ep9_temporal has a
# direct edge only to turn on `force-soft-floats`, so `libm::fma` is the soft, correctly rounded
# code (no `fmadd`/`vfmadd`) on every target.
libm = { version = "=0.2.16", default-features = false }
# Intl (ECMA-402 on ICU4X; INTL-I1-D5): the 2.3.x line of the icu_calendar that temporal_rs
# pins, exact pins (the `unstable` APIs can change in a minor release), no default features.
# Only ep9_intl imports them (dep-guards checks 21-23). Data: the baked compiled data (D10,
# INTL-I1-D4). Not used: the `icu` meta crate (its default turns on icu_segmenter/auto, so
# lstm and core_maths), serde, datagen, logging, log, ryu, lstm, auto, ixdtf,
# icu_provider_blob. One BUMP step moves them all at once (INTL-I1-D5).
icu_locale_core = { version = "=2.3.0", default-features = false, features = ["alloc"] }
icu_locale = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "=2.3.1", default-features = false, features = ["compiled_data", "latin1"] }
# NFD and the canonical combining class for the collator's stream-safe step (ep9_intl
# collator.rs; Codex r1 COLLATOR-1): already in the graph through icu_collator, with the same
# version, features and data.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data", "utf16_iter"] }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data", "unstable"] }
fixed_decimal = { version = "=0.7.2", default-features = false }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["compiled_data", "unstable"] }
icu_list = { version = "=2.3.0", default-features = false, features = ["compiled_data", "alloc"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data"] }
icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_time = { version = "=2.3.0", default-features = false, features = ["compiled_data", "alloc"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data", "unstable"] }
icu_provider = { version = "=2.3.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every unsafe block needs a true "// SAFETY:" comment. CI runs clippy with -D warnings.
undocumented_unsafe_blocks = "warn"

[profile.release]
# Fat LTO and one codegen unit, as in the parser benchmarks (08-repo section 4).
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# H23: no panic unwinds through a JIT or AOT frame. Every artifact of this profile and of
# dev-opt (it inherits release) aborts on a panic: ep9, ep9-test262 (its workers run each test
# in a child process, so a panic is a "worker crash" infrastructure error), ep9-bench and the
# disasm-check and fp-check builds. Test harnesses, build scripts and proc macros keep
# unwinding. Cargo has no per-package `panic`. dep-guards check 13 keeps this line.
panic = "abort"

# Fast local iteration with release optimization. Not for performance numbers.
[profile.dev-opt]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The regress fork (V9-D15; third_party/patches/regress/README.md): the commit in
# third_party/regress.commit (upstream v0.12.0) plus third_party/patches/regress/*.patch.
# Run `bash scripts/sync-regress.sh` before the first cargo command in a new tree: a missing
# path fails every cargo command. spikes/spike-b and spikes/spike-c have the same entry (a
# [patch] applies only at its own workspace root); dep-guards check 16 checks all three.
[patch.crates-io]
regress = { path = "third_party/regress" }
