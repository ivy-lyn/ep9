[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# gc-lint parses the engine sources. All three are already in Cargo.lock (proc-macro
# dependencies of oxc), so the lock gains no package. Host-only: never in the engine graph.
[dependencies]
syn = { version = "2.0.119", features = ["full", "visit"] }
# Span::start() (file:line in findings) exists only with span-locations outside a proc macro.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# ToTokens: prints a matched type in a finding.
quote = "1.0.47"

[lints]
workspace = true
