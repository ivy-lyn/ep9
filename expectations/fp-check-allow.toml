# cargo xtask fp-check allow list (H36, docs/adr/H36-fp-semantics.md; tools/xtask/src/fpcheck.rs).
#
# An [[allow]] entry lets a banned libm symbol appear in one function of the shipped ep9
# object. An [[allow-crate]] entry lets a math crate (libm, pxfm, core_maths, micromath) into
# the graph of ep9 when every path to it goes through a `via` package; the symbol and FMA
# scans of the object still apply to its code. The file is a small TOML subset that fp-check
# reads by hand: string values and one-line arrays of strings. More than 5 entries of both
# kinds together reopens H36 (fp-check then fails).
#
#   symbols   banned symbols, by C name ("pow", not "_pow" or "__imp_pow")
#   function  demangled function path; its generic instances and closures match too
#   targets   "all", or an array of target triples
#   crates    ([[allow-crate]]) math crates that may be in the graph
#   via       ([[allow-crate]]) every path from ep9 to each crate passes one of these packages
#   reopen    when the entry can go
#   reason    why the call cannot change a JS-visible number

[[allow]]
symbols = ["fmod", "pow"]
function = "oxc_semantic::ts_enum::eval::evaluate_expression"
targets = "all"
reopen = "H3 enum lowering (M4): BytecodeGen folds TS enums with ep9_math"
reason = "oxc_semantic folds TS enum `%` and `**` with host fmod/powf; BytecodeGen rejects TSEnumDeclaration (crates/ep9_frontend/src/bytecodegen/stmt.rs), so ep9 never reads those values"

[[allow-crate]]
crates = ["core_maths", "libm"]
via = ["ep9_temporal", "ep9_intl"]
reopen = "temporal_rs and icu_calendar route their float math through ep9_math, or an ICU4X bump puts astronomy on a runtime path (tools/calprobe counts a core_maths call)"
reason = "design SPEC-T-D19, INTL-I1-D2: temporal_rs and calendrical_calculations (through icu_calendar, icu_time and icu_datetime) reach libm through core_maths. Every path goes through ep9_temporal or ep9_intl; ep9_intl depends on ep9_temporal, whose direct libm edge turns on force-soft-floats in every graph that holds either (a path through any other crate fails). (1) The one FMA site is temporal_rs Fraction::to_finite_f64_slow in the ISO Duration.prototype.total path: libm::fma is the soft, correctly rounded code, so the bits are the same on every target and the object has no FMA instruction. (2) icu_calendar (the version in Cargo.lock) computes every calendar with tables and integer arithmetic; the astronomy code has callers only in the opt-in China::gb_t_33661_2017, Korea::adapted_gb_t_33661_2017 and tests, which ep9 never calls (the INTL-I1 probe, tools/calprobe: 0 core_maths calls for each calendar that ep9 accepts, on dates across the whole Temporal range and through every Temporal operation it runs; its positive control counts the sin calls of the opt-in code). That opt-in code imports the host fmod through core_maths rem_euclid, so the symbol scan fails if it is linked. Each icu_calendar bump runs tools/calprobe as a gate"
